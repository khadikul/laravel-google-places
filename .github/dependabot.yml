version: 2

updates:
  # Composer is only used for dev tooling here: the package itself depends on
  # nothing but illuminate/*, so the blast radius is small.
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    commit-message:
      prefix: "deps"

  # Workflow actions are worth watching: a compromised action runs with the
  # repository's token.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: ["dependencies", "ci"]
    commit-message:
      prefix: "ci"
